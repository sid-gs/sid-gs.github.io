<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
(function () {
  var img = document.getElementById('author-avatar-toggle');
  if (!img || !img.dataset.avatarNew || !img.dataset.avatarOld) return;
  var showingNew = true;
  img.style.cursor = 'pointer';
  img.addEventListener('click', function () {
    showingNew = !showingNew;
    img.src = showingNew ? img.dataset.avatarNew : img.dataset.avatarOld;
  });
})();
</script>
